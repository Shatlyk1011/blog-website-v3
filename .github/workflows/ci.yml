name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.154.5"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/hugo.tar.gz -C "$RUNNER_TEMP/bin" hugo
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Pagefind
        run: pip install "pagefind[bin]==1.5.2"

      - name: Build the site
        run: hugo --gc --minify --panicOnWarning --printPathWarnings

      - name: Build the search index
        run: python3 -m pagefind --site public

      - name: Check internal links
        run: python3 themes/taiga/scripts/check-links.py public

